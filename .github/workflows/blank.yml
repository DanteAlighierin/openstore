name: Mirror from Codeberg

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      CODEBERG_URL: https://codeberg.org/mi6e4ka/openstore.git

    steps:
      - name: Prepare mirror dir
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory '*'
          rm -rf /tmp/codeberg-mirror

      - name: Mirror Codeberg to GitHub
        shell: bash
        run: |
          set -euxo pipefail

          git clone --bare "$CODEBERG_URL" /tmp/codeberg-mirror
          git -C /tmp/codeberg-mirror remote set-url --push origin "https://x-access-token:${GH_PAT}@github.com/DanteAlighierin/openstore.git"

          # GitHub refuses to delete the default branch during a prune push.
          # Skip pruning so the mirror can sync branches without rejecting the
          # current/default branch (for example, master).
          git -C /tmp/codeberg-mirror push origin \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
