name: Mirror from Codeberg

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    name: Mirror
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to GitHub
        run: |
          git remote add codeberg https://codeberg.org/mi6e4ka/openstore.git
          git fetch codeberg --tags --prune
          git push "https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" --all --force
          git push "https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" --tags --force
