- name: Prepare mirror workspace
  run: |
    set -euxo pipefail
    git config --global --add safe.directory '*'
    rm -rf /tmp/codeberg-mirror

- name: Mirror Codeberg to GitHub
  run: |
    set -euxo pipefail
    git clone --mirror "$CODEBERG_URL" /tmp/codeberg-mirror
    git -C /tmp/codeberg-mirror remote set-url --push origin "https://x-access-token:${GH_PAT}@github.com/DanteAlighierin/openstore.git"
    git -C /tmp/codeberg-mirror push --mirror
