name: Mirror from Codeberg

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Mirror
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      CODEBERG_URL: https://codeberg.org/mi6e4ka/openstore.git
      GITHUB_URL: https://github.com/DanteAlighierin/openstore.git
    steps:
      - name: Prepare mirror workspace
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory '*'
          rm -rf /tmp/codeberg-mirror

      - name: Mirror Codeberg to GitHub
        shell: bash
        run: |
          set -euxo pipefail

          git clone --mirror "$CODEBERG_URL" /tmp/codeberg-mirror
          git -C /tmp/codeberg-mirror remote set-url --push origin "https://x-access-token:${GH_PAT}@github.com/DanteAlighierin/openstore.git"
          git -C /tmp/codeberg-mirror push --mirror
