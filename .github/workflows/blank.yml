name: Mirror from Codeberg

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    name: Mirror
    steps:
      - name: Add workspace to Git safe.directory
        run: git config --global --add safe.directory /github/workspace

      - name: Mirror Codeberg to GitHub
        id: mirror
        uses: bridgelightcloud/github-mirror-action@v1
        with:
          origin: 'https://codeberg.org/mi6e4ka/openstore.git'
          github_token: ${{ secrets.GH_PAT }}
